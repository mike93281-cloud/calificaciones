<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Consulta de calificaciones</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--muted:#677084;--line:#e2e5ea;--brand:#7a1f3d;--soft:#f0e6ea;--ok:#1e8a4c;--bad:#c62f2f;--warn-bg:#fbf0dc}
@media (prefers-color-scheme: dark){:root{--bg:#14161b;--card:#1d2027;--ink:#e8eaf0;--muted:#9aa1b2;--line:#2e323c;--brand:#c8557c;--soft:#3a2430;--ok:#4cc985;--bad:#f07070;--warn-bg:#3a2f18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#7a1f3d;color:#fff;padding:18px 16px}
header h1{margin:0;font-size:20px}
header div{opacity:.85;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
input{display:block;width:100%;margin-top:4px;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
button{font:inherit;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;background:#7a1f3d;color:#fff}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
.err{background:var(--warn-bg);border-radius:9px;padding:10px 12px;margin-top:12px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
h2{margin:0 0 2px;font-size:19px}
h3{margin:0;font-size:16px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.uh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Consulta de calificaciones</h1><div id="sub"></div></header>
<main>
  <div class="card" id="login">
    <form id="f">
      <label>Matrícula<input id="m" autocomplete="username" placeholder="Ej. 261000000-1" required></label>
      <label>Clave personal<input id="c" autocomplete="off" placeholder="La que te dio tu profesor" required></label>
      <button id="go">Consultar</button>
    </form>
    <div class="err hidden" id="err"></div>
    <p class="muted" style="margin-bottom:0" id="upd"></p>
  </div>
  <div id="out"></div>
</main>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const norm = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
const g = v => (Math.round(v*100)/100).toString();
$('sub').textContent = DATA.titulo;
$('upd').textContent = 'Última actualización: ' + DATA.actualizado + '.';

async function consultar(mat, clave){
  const enc = new TextEncoder();
  const id = hex(await crypto.subtle.digest('SHA-256', enc.encode(DATA.salt + ':' + norm(mat)))).slice(0,20);
  const rec = DATA.r[id];
  // se deriva la llave aunque la matrícula no exista, para no revelar cuáles existen
  const km = await crypto.subtle.importKey('raw', enc.encode(norm(mat) + ':' + norm(clave)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(DATA.salt), iterations:DATA.it, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  if (!rec) throw new Error('x');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(rec.i)}, key, b64d(rec.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(s){
  let h = '<div class="card"><h2>'+esc(s.nombre)+'</h2><div class="muted">Grupo '+esc(s.grupo)+' · Matrícula '+esc(s.matricula)+'</div><div class="big">';
  if (s.final != null) h += '<div class="stat"><b>'+s.final.toFixed(1)+'</b><span>Calificación final</span></div>';
  else h += '<div class="stat"><b>'+s.puntos.toFixed(2)+'</b><span>puntos acumulados de '+g(s.posibles)+' evaluados hasta ahora</span></div>';
  if (s.extra) h += '<div class="stat"><b>+'+g(s.extra)+'</b><span>puntos extra</span></div>';
  if (s.asis) h += '<div class="stat"><b>'+s.asis.pct+'%</b><span>asistencia · '+s.asis.faltas+' falta'+(s.asis.faltas===1?'':'s')+' en '+s.asis.total+' clases</span></div>';
  h += '</div>';
  if (s.final == null) h += '<p class="muted" style="margin:12px 0 0">La calificación final se publica al cerrar el semestre. Los puntos acumulados son lo que llevas sobre 10.</p>';
  h += '</div>';
  for (const u of s.unidades){
    h += '<div class="card"><div class="uh"><h3>'+esc(u.nombre)+'</h3>'+(u.periodo?'<span class="muted">'+esc(u.periodo)+'</span>':'')+'</div>';
    if (u.calif != null) h += '<p style="margin:8px 0 0">Calificación de la unidad: <b>'+u.calif.toFixed(1)+'</b> <span class="muted">('+u.puntos.toFixed(2)+' de '+g(u.de)+' puntos de la calificación final)</span></p>';
    if (u.asis) h += '<p class="muted" style="margin:4px 0 0">Asistencia en la unidad: '+u.asis.pct+'% ('+u.asis.faltas+' falta'+(u.asis.faltas===1?'':'s')+' en '+u.asis.total+' clases)</p>';
    if (u.items.length){
      h += '<table><thead><tr><th>Actividad</th><th class="n">Valor</th><th class="n">Calificación</th></tr></thead><tbody>';
      for (const i of u.items) h += '<tr><td>'+esc(i.nombre)+(i.tipo==='ta'?' <span class="chip">Tarea auténtica</span>':'')+'</td><td class="n">'+(i.tipo==='ta'?g(i.pct)+'%':'–')+'</td><td class="n">'+(i.nota==null?'<span class="muted">Sin calificar</span>':'<b>'+g(i.nota)+'</b>')+'</td></tr>';
      h += '</tbody></table>';
    } else h += '<p class="muted" style="margin:8px 0 0">Aún no hay actividades registradas en esta unidad.</p>';
    h += '</div>';
  }
  h += '<p class="muted">Si ves algún error en tus calificaciones, coméntalo con tu profesor.</p><button class="sec" id="bye">Salir</button>';
  $('out').innerHTML = h; $('login').classList.add('hidden');
  $('bye').onclick = () => { $('out').innerHTML = ''; $('login').classList.remove('hidden'); $('c').value = ''; };
  window.scrollTo(0,0);
}
$('f').onsubmit = async e => {
  e.preventDefault(); $('err').classList.add('hidden');
  if (!window.crypto || !crypto.subtle){ $('err').textContent = 'Tu navegador no permite abrir esta consulta. Usa Chrome, Edge o Safari actualizados.'; $('err').classList.remove('hidden'); return; }
  $('go').disabled = true; $('go').textContent = 'Consultando…';
  try { show(await consultar($('m').value, $('c').value)); }
  catch(x){ $('err').textContent = 'La matrícula o la clave no coinciden. Revisa que la matrícula incluya el dígito final y que la clave esté completa.'; $('err').classList.remove('hidden'); }
  $('go').disabled = false; $('go').textContent = 'Consultar';
};
</script>
